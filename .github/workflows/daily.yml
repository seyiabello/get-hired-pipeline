name: Daily job pipeline

on:
  schedule:
    # GitHub cron is UTC, and scheduled triggers can arrive late or not at all.
    # 07:00 UK time is 06:00 UTC in summer and 07:00 UTC in winter. Four triggers are
    # scheduled; the guard step lets through the first one that arrives at or after
    # 07:00 in London and skips the rest of that day. The later two are spares.
    # Minute 7 is used because the top of the hour is when GitHub is busiest.
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
  # Started by hand, or by an outside scheduler as a backup (see the README).
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, even if the pipeline has already run today or it is before 07:00"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # the guard looks up today's earlier runs

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Sets go=true for the first trigger of the day and go=false for the rest.
      # A dispatch without force is treated exactly like a scheduled trigger.
      - name: Decide whether this trigger should run
        id: clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: python3 -m pipeline.schedule_guard

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.clock.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.clock.outputs.go == 'true'
        run: python -m pytest -q

      - name: Write connections.csv from secret
        if: steps.clock.outputs.go == 'true'
        env:
          CONNECTIONS_CSV: ${{ secrets.CONNECTIONS_CSV }}
        run: |
          if [ -n "$CONNECTIONS_CSV" ]; then
            printf '%s\n' "$CONNECTIONS_CSV" > connections.csv
          else
            echo "CONNECTIONS_CSV is not set, every job will be tagged Cold"
          fi

      - name: Run pipeline
        if: steps.clock.outputs.go == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python main.py

      - name: Upload jobs.csv
        if: always() && steps.clock.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jobs-csv
          path: jobs.csv
          if-no-files-found: warn
          retention-days: 14
