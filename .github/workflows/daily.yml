name: Daily job pipeline

on:
  schedule:
    # GitHub cron is UTC, and scheduled triggers can arrive late or not at all.
    # 07:00 UK time is 06:00 UTC in summer and 07:00 UTC in winter. Four triggers are
    # scheduled; the first step lets through the first one that arrives at or after
    # 07:00 in London and skips the rest of that day. The later two are spares.
    # Minute 7 is used because the top of the hour is when GitHub is busiest.
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # to check whether today's run has already happened

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Decide whether this trigger should run
        id: clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(TZ=Europe/London date +%-H)
            today=$(date -u +%F)
            # A run that got as far as the pipeline uploads a jobs-csv artifact.
            done_today=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=jobs-csv&per_page=20" \
              --jq "[.artifacts[] | select(.created_at | startswith(\"$today\"))] | length" || echo 0)
            if [ "$hour" -lt 7 ]; then
              echo "London hour is $hour, too early, skipping this trigger"
              go=false
            elif [ "$done_today" -gt 0 ]; then
              echo "The pipeline has already run today, skipping this trigger"
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.clock.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.clock.outputs.go == 'true'
        run: python -m pytest -q

      - name: Write connections.csv from secret
        if: steps.clock.outputs.go == 'true'
        env:
          CONNECTIONS_CSV: ${{ secrets.CONNECTIONS_CSV }}
        run: |
          if [ -n "$CONNECTIONS_CSV" ]; then
            printf '%s\n' "$CONNECTIONS_CSV" > connections.csv
          else
            echo "CONNECTIONS_CSV is not set, every job will be tagged Cold"
          fi

      - name: Run pipeline
        if: steps.clock.outputs.go == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python main.py

      - name: Upload jobs.csv
        if: always() && steps.clock.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jobs-csv
          path: jobs.csv
          if-no-files-found: warn
          retention-days: 14
